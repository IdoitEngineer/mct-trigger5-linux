# SPDX-License-Identifier: GPL-2.0-only
#
# GitHub Actions mirror of .gitlab-ci.yml: stock-distribution builds and
# DKMS-install checks on Debian 13 (6.12) and Ubuntu 26.04 (7.0), plus a
# release job that attaches the .deb to the tag's GitHub Release.
#
# The distro images are used as containers so the headers and toolchain match
# the GitLab pipeline exactly, independent of the runner's host OS.

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  lint:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates build-essential dpkg-dev debhelper lintian
      - uses: actions/checkout@v4
      - name: Build and lint the Debian package
        run: |
          cd linux-trigger5
          make debpkg
          lintian ../trigger5-dkms_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: dkms-deb
          path: trigger5-dkms_*.deb
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-6.12
            image: debian:trixie
            headers: linux-headers-amd64
          - name: ubuntu-7.0
            image: ubuntu:26.04
            headers: linux-headers-generic
    container: ${{ matrix.image }}
    steps:
      - name: Install kernel headers
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates build-essential dkms kmod ${{ matrix.headers }}
      - uses: actions/checkout@v4
      - name: Build the module
        run: ci/build-module.sh "$GITHUB_WORKSPACE"

  tools:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install tool dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates build-essential pkg-config libdrm-dev libusb-1.0-0-dev
      - uses: actions/checkout@v4
      - name: Build trigger5-tool
        run: make -C linux-trigger5/tools

  test-install:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-6.12
            image: debian:trixie
            headers: linux-headers-amd64
          - name: ubuntu-7.0
            image: ubuntu:26.04
            headers: linux-headers-generic
    container: ${{ matrix.image }}
    steps:
      - name: Install DKMS and kernel headers
        run: |
          apt-get update -qq
          apt-get install -y -qq git ca-certificates dkms kmod ${{ matrix.headers }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dkms-deb
      - name: Install the .deb and verify the DKMS build
        run: ci/test-install.sh "$(ls -1t trigger5-dkms_*.deb | head -n1)"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dkms-deb
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          deb="trigger5-dkms_${version}_all.deb"
          test -f "$deb"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$deb"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "trigger5 ${tag}" \
              --notes "DKMS package for ${tag}. See CHANGELOG.md." \
              "$deb"
          fi
