#
# DKMS configuration for the MCT Trigger 5 USB display driver.

PACKAGE_NAME="trigger5"
PACKAGE_VERSION="1.0.1"
# The driver supports the 6.12 LTS DRM API and the 7.x series. The atomic
# state/commit rename (7.2) and the atomic_create_state callbacks (7.3) are
# handled at compile time.
BUILD_EXCLUSIVE_KERNEL_MIN="6.12"
BUILT_MODULE_NAME[0]="trigger5"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"

MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make clean KDIR=${kernel_source_dir}"
