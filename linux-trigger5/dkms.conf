#
# DKMS configuration for the MCT Trigger 5 USB display driver.

PACKAGE_NAME="trigger5"
PACKAGE_VERSION="1.0"
# The driver uses DRM APIs introduced in 7.3 (e.g. atomic_create_state and
# drm/clients/drm_client_setup.h). Older kernels are skipped rather than
# failing the DKMS build.
BUILD_EXCLUSIVE_KERNEL_MIN="7.3"
BUILT_MODULE_NAME[0]="trigger5"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"

MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make clean KDIR=${kernel_source_dir}"
